<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG_LINKS}}

<!-- Favicons & manifest -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#5B3FE4">
<meta name="color-scheme" content="light">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FluxForge">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:locale:alternate" content="{{OG_LOCALE_ALT}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="https://fluxforge.pt/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://fluxforge.pt/assets/og-image.png">

<!-- Fonts: self-hosted, preloaded -->
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-latin-ext.woff2" crossorigin>

<link rel="stylesheet" href="/assets/css/styles.css">

<!-- JSON-LD: Organization (every page) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "FluxForge",
  "url": "https://fluxforge.pt",
  "logo": "https://fluxforge.pt/assets/logo.svg",
  "email": "contacto@fluxforge.pt",
  "areaServed": "PT",
  "sameAs": []
}
</script>
{{JSONLD_EXTRA}}
